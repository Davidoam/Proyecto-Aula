name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LIMITE_LINEAS: 400

jobs:
  tamano-pr:
    name: gate de tamano de PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: contar lineas del diff
        run: |
          LINEAS=$(git diff --numstat origin/${{ github.base_ref }}...HEAD \
            | awk '{s+=$1+$2} END {print s+0}')
          echo "diff de $LINEAS lineas (limite $LIMITE_LINEAS)"
          if [ "$LINEAS" -gt "$LIMITE_LINEAS" ]; then
            echo "::error::PR de $LINEAS lineas. El limite es $LIMITE_LINEAS."
            echo "Un PR que no se puede revisar no se puede aprobar. Partelo."
            exit 1
          fi

  tests:
    name: suite y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: pytest
        run: python3 -m pytest tests/ -q --cov=src/aula --cov-report=term-missing
      - name: cobertura minima del dominio
        run: python3 -m pytest tests/ -q --cov=src/aula --cov-fail-under=60

  trazabilidad:
    name: trazabilidad spec a test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: todo criterio de aceptacion tiene test
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from agentes.mcp_aula.servidor import listar_specs, trazabilidad
          fallo = False
          for s in listar_specs()["specs"]:
              if s["estado"] != "activa":
                  continue
              t = trazabilidad({"spec_id": s["id"]})
              print("%s: %.1f%% de cobertura de criterios" % (s["id"], t["cobertura_pct"]))
              if t["sin_cubrir"]:
                  print("::error::%s sin cubrir: %s" % (s["id"], ", ".join(t["sin_cubrir"])))
                  fallo = True
          sys.exit(1 if fallo else 0)
          PY

  conformidad:
    name: agente de conformidad de spec
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: evaluar el agente contra el conjunto dorado
        run: python3 -m agentes.conformidad.evaluar
      - name: construir entrada del PR y aplicar veredicto
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > .pr-body.md
          python3 herramientas/conformidad_pr.py \
            --base "origin/$BASE_REF" --cuerpo .pr-body.md

  imagen:
    name: build imagen OCI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: podman build
        run: |
          if command -v podman >/dev/null; then podman build -t aula:ci .; \
          else docker build -t aula:ci .; fi

  despliegue:
    name: prueba de despliegue en entorno aislado
    needs: [tests, trazabilidad, imagen]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: construir y arrancar la imagen
        run: |
          docker build -t aula:ci .
          docker run --rm -d --name aula-ci -p 8000:8000 aula:ci
      - name: comprobar readiness
        run: |
          for intento in $(seq 1 20); do
            if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=2)"; then exit 0; fi
            sleep 1
          done
          docker logs aula-ci
          exit 1
      - name: recoger evidencia y retirar entorno
        if: always()
        run: |
          docker logs aula-ci || true
          docker stop aula-ci || true
